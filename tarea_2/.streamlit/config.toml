# Tema claro fijo: fondo blanco aunque el sistema del visitante esté en modo oscuro.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f6f4"
textColor = "#0b0b0b"
font = "sans-serif"
borderColor = "#e6e5e0"
showWidgetBorder = true
baseRadius = "medium"

[theme.sidebar]
backgroundColor = "#f7f7f5"

[client]
toolbarMode = "minimal"
